[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmvl-worker"
version = "0.1.0"
description = "Scheduler and CLI for the Prediction Market Value Lab pipeline"
requires-python = ">=3.11"
dependencies = [
    "pmvl-shared",
    "pmvl-markets",
    "APScheduler>=3.11,<4",
    "typer>=0.15,<1",
    "rich>=13,<15",
]

[project.scripts]
pmvl = "pmvl_worker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

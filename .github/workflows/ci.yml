name: CI

# A green Vercel build proves the frontend compiles. It proves nothing about the
# Python tests, the snapshot the API boots from, or whether demo data can leak into a
# live surface - all of which have broken production at least once on this project.
on:
  # Every branch, deliberately. A name-pattern allowlist meant a branch called
  # fix-* pushed with no CI at all and nothing said so - the failure mode of a
  # gate is that it silently is not there.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Publication commits are pushed by the workflow's GITHUB_TOKEN. GitHub
  # deliberately suppresses new push-triggered Actions runs for those commits,
  # so the publishing workflow calls this workflow explicitly with the exact
  # commit it created.
  workflow_call:
    inputs:
      commit_sha:
        description: "Exact published commit to verify"
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.commit_sha || github.ref }}
  cancel-in-progress: true

# Read-only by default. No CI job needs to write to the repository, and a fork PR
# must not be able to. The publishing workflow grants write per job instead.
permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          # requirements.txt is deliberately the slim API runtime set - the test
          # tooling and quant stack live in requirements-dev.txt.
          pip install -r requirements-dev.txt
          pip install -e packages/shared -e packages/market-normalization \
                      -e services/api -e services/worker
      - name: Lint
        # ruff is pinned in requirements-dev.txt, so the gate's rules cannot
        # drift with the install. Correctness rules only for now: style-only
        # findings across a codebase this size would drown the signal, and a
        # lint job people ignore is worse than none.
        run: ruff check packages services scripts tests
      - name: Tests
        run: pytest -q
      - name: Compile check
        run: python -m compileall -q packages services scripts

  snapshot:
    name: Snapshot integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/shared -e packages/market-normalization -e services/api
      - name: Validate the committed snapshot
        # Three failures that each took production down: the snapshot missing from the
        # bundle, the snapshot in WAL mode (unopenable read-only on a serverless
        # mount), and the snapshot present but unable to answer the API's queries.
        run: python scripts/validate_snapshot.py

  pipeline-smoke:
    name: Pipeline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Read-only: a PR run must never be able to publish, and a fork PR must never
    # see a provider secret. The pipeline works against public endpoints only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/shared -e packages/market-normalization \
                      -e services/api -e services/worker
      - name: Lint the workflow files
        # A workflow that only runs from the default branch cannot be tested by
        # running it, so its syntax and its safety properties are checked here.
        run: |
          python - <<'PY'
          import sys, yaml
          from pathlib import Path

          failures = []
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              doc = yaml.safe_load(path.read_text())
              # PyYAML parses the `on:` key as the boolean True.
              triggers = doc.get("on", doc.get(True, {}))
              if not triggers:
                  failures.append(f"{path}: no triggers")
              perms = doc.get("permissions")
              if perms is None:
                  failures.append(f"{path}: no top-level permissions block")
              elif perms.get("contents") == "write":
                  # Write must be granted per job, never to the whole workflow.
                  failures.append(f"{path}: contents:write at workflow level")
              print(f"{path}: ok")
          if failures:
              print("\n".join(f"::error::{f}" for f in failures))
              sys.exit(1)
          PY
      - name: Run the pipeline in smoke mode
        # The same script the scheduled workflow calls, on a handful of markets,
        # with publication impossible. This is what makes the pipeline testable
        # before it merges - workflow_dispatch and schedule only fire from the
        # default branch.
        env:
          GITHUB_EVENT_NAME: pull_request
          # Reusable workflows retain the caller's github.sha. The explicit
          # input is the publication commit and must win for provenance.
          PMVL_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        run: python scripts/run_automated_snapshot_pipeline.py --report run-report.json
      - name: Assert the smoke run published nothing
        run: |
          python - <<'PY'
          import json, sys

          report = json.load(open("run-report.json"))
          failures = []
          if report["published"]:
              failures.append("a pull-request run published a snapshot")
          # A PR run must also not claim to have handed a candidate onward, and
          # must not assert cross-run persistence it does not have.
          if report["candidate_disposition"] != "discarded":
              failures.append(
                  f"candidate_disposition is {report['candidate_disposition']!r}; "
                  "a PR run must discard"
              )
          if report["state_persisted_across_runs"] is not False:
              failures.append("the run claims state persisted across runs")
          if report["execution_model"] != "stateless_recompute_from_published_snapshot":
              failures.append(f"unexpected execution_model {report['execution_model']!r}")

          print(f"scope:           {report['scope']}")
          print(f"execution model: {report['execution_model']}")
          print(f"init:            {report['operational_init_source']}")
          print(f"parent:          {report['parent_snapshot_id']}")
          print(f"disposition:     {report['candidate_disposition']}")
          for job, status in report["statuses"].items():
              print(f"  {status:16} {job}")

          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PY

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        # `|| true` here meant this job reported green for every push while
        # `next lint` (removed in Next 16) errored on a missing directory. The
        # exit code is honoured now; `any` at the fetch boundary stays a warning
        # so the gate fails on real defects rather than on annotation debt.
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        # Before the tests, deliberately: one of them scans `.next/static` for
        # secret values, and with no build output it would skip rather than fail
        # - a gate that quietly does nothing is the failure mode this workflow
        # already learned once with `next lint`.
        run: npm run build
      - name: Tests
        run: npm run test

  extension:
    name: Extension build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build bundles
        # Before the tests: the packaging tests read dist/, and building with
        # them absent would be a gate that quietly skips itself.
        run: npm run build
      - name: Tests
        # Conformance (BigInt vs Python), panel escaping, background message
        # boundary, content race/fail-closed side, order-form readers, venue
        # adapters, packaging - the suites that cannot run on an arm64 laptop
        # with x64 tooling binaries.
        run: npm run test
      - name: Package the developer-mode beta
        run: python3 scripts/package.py
      - name: The shipped beta archive must match the source
        # The web site serves this tracked zip as the public download. A source
        # change that is not reflected in the shipped archive would publish an
        # old extension under new release notes.
        run: |
          cd ../..
          if ! git diff --quiet -- apps/web/public/downloads/pmvl-entry-cost-beta.zip; then
            echo "::error::the committed beta archive is stale; rebuild and commit it"
            exit 1
          fi
          echo "shipped beta archive matches the source"
      - name: Upload the freshly built beta archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmvl-entry-cost-beta
          path: apps/web/public/downloads/pmvl-entry-cost-beta.zip
          retention-days: 7
          if-no-files-found: error

  postgres:
    name: Postgres persistence semantics
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pmvl
          POSTGRES_PASSWORD: pmvl
          POSTGRES_DB: pmvl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmvl -d pmvl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-dev.txt "psycopg[binary]>=3.2,<4"
          pip install -e packages/shared -e packages/market-normalization \
                      -e services/api -e services/worker
      - name: Run the repaired persistence tests against PostgreSQL
        # The same concurrency, idempotency and rule-persistence tests the
        # default suite runs on SQLite, now against the production-style
        # database: the ON CONFLICT paths, the partial unique index and the
        # rule-hash round-trip must behave identically on both dialects.
        env:
          PMVL_TEST_DATABASE_URL: postgresql+psycopg://pmvl:pmvl@localhost:5432/pmvl
        run: |
          python -m pytest \
            tests/test_ingest_concurrency_and_rule_roundtrip.py \
            tests/test_job_idempotency.py \
            tests/test_rule_version_ingestion.py \
            tests/test_rule_versioning.py \
            -q

  docker:
    name: Docker compose build and smoke boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      # A compose file that references Dockerfiles which do not exist was
      # committed once and shipped a documented-but-broken deployment path for
      # weeks. This gate validates the file shape, asserts every referenced
      # build path exists, BUILDS all three images, and smoke-boots the API
      # against Postgres with a health check - config alone would be the fake
      # claim of "Docker validated".
      - name: Validate the compose file
        run: docker compose config -q
      - name: Assert every referenced build path exists
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import yaml

          doc = yaml.safe_load(pathlib.Path("docker-compose.yml").read_text())
          failures = []
          for name, service in (doc.get("services") or {}).items():
              build = service.get("build")
              if build is None:
                  continue
              if isinstance(build, str):
                  failures.append(f"{name}: build is a bare path {build!r}; use context/dockerfile")
                  continue
              context = pathlib.Path(build.get("context", "."))
              dockerfile = build.get("dockerfile", "Dockerfile")
              target = pathlib.Path(dockerfile)
              if not target.is_absolute():
                  target = context / target
              if not target.is_file():
                  failures.append(f"{name}: {target} does not exist")
          if failures:
              print("\n".join(f"::error::{f}" for f in failures))
              sys.exit(1)
          print("all compose build paths exist")
          PY
      - name: Build all images
        run: docker compose build
      - name: Smoke boot API against Postgres
        run: |
          docker compose up -d postgres api
          healthy=false
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json 2>/dev/null; then
              if grep -q '"status"' /tmp/health.json && grep -q 'ok' /tmp/health.json; then
                healthy=true
                break
              fi
            fi
            sleep 3
          done
          if [ "$healthy" != true ]; then
            echo "::error::API did not become healthy"
            docker compose logs api postgres
            exit 1
          fi
          echo "API healthy: $(cat /tmp/health.json)"
          docker compose down -v --remove-orphans

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Refuse committed credentials
        run: |
          set -e
          if git ls-files | grep -qE '(^|/)\.env$|\.pem$|\.key$'; then
            echo "A credential file is tracked in git."
            exit 1
          fi
          # .env.example must stay a template.
          if grep -qE '^(ANTHROPIC_API_KEY|KALSHI_API_KEY_ID|CLERK_SECRET_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET)=.+' .env.example; then
            echo ".env.example contains a real-looking value."
            exit 1
          fi
          # Any Clerk or Stripe credential shape, anywhere in the tree. A test
          # key is still a credential; the setup docs name the variables and
          # never their values.
          if git grep -nIE '(sk_(live|test)_[A-Za-z0-9]{8}|rk_(live|test)_[A-Za-z0-9]{8}|whsec_[A-Za-z0-9]{16}|pk_live_[A-Za-z0-9]{8})' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "A Clerk or Stripe credential appears to be committed."
            exit 1
          fi
          echo "No tracked credentials."

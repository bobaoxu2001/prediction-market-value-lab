name: Pipeline

# Thin by design. Every decision lives in
# scripts/run_automated_snapshot_pipeline.py, which PR CI runs in smoke mode, so
# the logic is exercised before it merges. workflow_dispatch and schedule only
# fire from the default branch, so a workflow carrying its own logic cannot be
# tested until after it lands - exactly when a mistake is most expensive.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "smoke (capped) or full (entire market universe)"
        type: choice
        options: [smoke, full]
        default: smoke
      market_limit:
        description: "Override the smoke cap. Ignored when scope=full."
        type: string
        default: ""
      publish:
        description: "Promote the validated candidate to the published snapshot"
        type: boolean
        default: false
  schedule:
    # Research refresh only; this never publishes. Hourly rather than every 15
    # minutes because the whole job set runs each time and the research product
    # does not need finer resolution than that.
    - cron: "17 * * * *"

concurrency:
  # One pipeline at a time. Two concurrent runs would seed from the same parent
  # snapshot and race to promote different children, and the loser's work would
  # vanish with no record that it happened.
  group: pipeline
  cancel-in-progress: false

# Least privilege at the top; only the publish job widens it.
permissions:
  contents: read

jobs:
  research:
    name: Research refresh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # A snapshot commit must not trigger another pipeline. The publish job commits
    # with [skip ci], and this guard is the second line of defence against a run
    # loop that would publish continuously.
    if: >-
      github.event_name != 'push' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      published: ${{ steps.run.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e packages/shared -e packages/market-normalization \
                      -e services/api -e services/worker

      - name: Check the schedule is enabled
        # A repository variable, so the schedule can be turned off without editing
        # and re-merging a workflow file. Default off: a merge must not silently
        # start running production jobs.
        if: github.event_name == 'schedule'
        run: |
          if [[ "${{ vars.PMVL_SCHEDULE_ENABLED }}" != "true" ]]; then
            echo "PMVL_SCHEDULE_ENABLED is not 'true'; skipping scheduled run."
            exit 78
          fi

      - name: Run pipeline
        id: run
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_MARKET_LIMIT: ${{ inputs.market_limit }}
          # Publication requires BOTH the dispatch input and the repository
          # variable. Either alone is insufficient, so a mistaken checkbox cannot
          # publish and neither can a variable somebody set and forgot.
          INPUT_PUBLISH: >-
            ${{ (inputs.publish == true &&
                 vars.PMVL_SCHEDULE_PUBLISH_ENABLED == 'true') && 'true' || 'false' }}
          PMVL_COMMIT_SHA: ${{ github.sha }}
          ENVIRONMENT: production
        run: |
          python scripts/run_automated_snapshot_pipeline.py --report run-report.json
          echo "published=$(python -c "import json;print(json.load(open('run-report.json'))['published'])")" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          if [[ ! -f run-report.json ]]; then
            echo "::error::the pipeline produced no report; it did not run to completion"
            exit 1
          fi
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "packages/shared/src")
          from pmvl_shared.pipeline_dag import PIPELINE

          report = json.load(open("run-report.json"))
          statuses, skipped = report["statuses"], report["skipped"]
          print(f"scope: {report['scope']}")
          print(f"parent snapshot: {report['parent_snapshot_id']} "
                f"({report['operational_init_source']})")

          missing = []
          for spec in PIPELINE:
              if spec.name in statuses:
                  print(f"  {statuses[spec.name]:16} {spec.name}")
              elif spec.name in skipped:
                  print(f"  {'SKIPPED':16} {spec.name} - {skipped[spec.name]}")
              else:
                  # The failure this catches: a job silently vanishing from the
                  # run and nobody noticing because nothing reported its absence.
                  missing.append(spec.name)
                  print(f"::error::{spec.name} did not run and was not skipped")

          for blocker in report["publication_blockers"]:
              print(f"::warning::publication blocked: {blocker}")
          if missing:
              raise SystemExit(1)
          PY

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-report
          path: run-report.json
          retention-days: 30

      - name: Commit published snapshot
        # The ONLY step with write access, and only when the script actually
        # promoted a candidate. Restricted to the default branch so a preview
        # branch can never publish to main.
        if: >-
          steps.run.outputs.published == 'True' &&
          github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "pmvl-pipeline[bot]"
          git config user.email "pmvl-pipeline@users.noreply.github.com"
          # Refuse to publish onto a moved main. Two runs promoting from different
          # parents would otherwise overwrite each other's history silently.
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::main moved during this run; refusing to publish. Re-run."
            exit 1
          fi
          git add data/pmvl-snapshot.db data/pmvl-snapshot.manifest.json
          git commit -m "data: publish validated snapshot from ${GITHUB_SHA:0:12} [skip ci]"
          # Never force. A rejected push means main moved and the run must be redone.
          git push origin HEAD:main

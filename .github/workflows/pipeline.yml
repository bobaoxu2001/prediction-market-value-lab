name: Pipeline

# Two jobs with two different tokens, because GitHub Actions permissions are
# JOB-scoped. The previous single job held `contents: read` and ended with a
# `git push`; setting GH_TOKEN on that step cannot elevate the token, so the first
# real publication attempt would have failed. Research is read-only and hands the
# candidate to a separate write-enabled job.
#
# Everything the pipeline decides lives in
# scripts/run_automated_snapshot_pipeline.py, which PR CI runs in smoke mode.
# workflow_dispatch and schedule only fire from the default branch, so a workflow
# carrying its own logic cannot be tested until after it merges.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "smoke (capped) or full (entire market universe)"
        type: choice
        options: [smoke, full]
        default: smoke
      market_limit:
        description: "Override the smoke cap. Ignored when scope=full."
        type: string
        default: ""
      publish:
        description: "Promote the validated candidate to the published snapshot"
        type: boolean
        default: false
  schedule:
    # Research refresh only. This can never publish: the publish job requires
    # workflow_dispatch.
    - cron: "17 * * * *"

concurrency:
  # One pipeline at a time. Two concurrent runs would seed from the same parent
  # and race to promote different children, and the loser's work would vanish.
  group: pipeline
  cancel-in-progress: false

# Read-only by default; only the publish job widens it.
permissions:
  contents: read

jobs:
  research:
    name: Research refresh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Never writes to the repository. It computes and hands over.
    permissions:
      contents: read
    # A disabled schedule must SKIP, not fail. The previous version ran a step
    # that exited 78, which Actions treats as a failure, so merging with the
    # variable unset would have produced a red workflow every hour - and the
    # `if: always()` report step would then fail again on the missing report.
    # A job-level `if` produces a skipped job and a green run.
    #
    # Manual dispatch is unaffected: PMVL_SCHEDULE_ENABLED governs scheduled
    # computation only, and is deliberately not coupled to publication.
    if: >-
      github.event_name != 'schedule' ||
      vars.PMVL_SCHEDULE_ENABLED == 'true'
    outputs:
      candidate_exists: ${{ steps.summarise.outputs.candidate_exists }}
      publication_eligible: ${{ steps.summarise.outputs.publication_eligible }}
      parent_snapshot_id: ${{ steps.summarise.outputs.parent_snapshot_id }}
      parent_snapshot_sha256: ${{ steps.summarise.outputs.parent_snapshot_sha256 }}
      candidate_snapshot_id: ${{ steps.summarise.outputs.candidate_snapshot_id }}
      candidate_uncompressed_sha256: ${{ steps.summarise.outputs.candidate_uncompressed_sha256 }}
      candidate_compressed_sha256: ${{ steps.summarise.outputs.candidate_compressed_sha256 }}
      source_commit_sha: ${{ github.sha }}
      pipeline_run_id: ${{ steps.summarise.outputs.pipeline_run_id }}
      # A rerun keeps github.run_id and github.sha. run_attempt is therefore part
      # of the identity too, or attempt 2 can collide with attempt 1's immutable
      # Actions artefact.
      artifact_name: pmvl-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e packages/shared -e packages/market-normalization \
                      -e services/api -e services/worker

      - name: Run pipeline
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_MARKET_LIMIT: ${{ inputs.market_limit }}
          # Deliberately NOT passed as INPUT_PUBLISH. The research job never
          # promotes anything; it emits a held candidate and the publish job
          # decides. Keeping promotion out of this job is what lets its token stay
          # read-only.
          PMVL_COMMIT_SHA: ${{ github.sha }}
          ENVIRONMENT: production
        run: |
          python scripts/run_automated_snapshot_pipeline.py \
            --report run-report.json \
            --candidate-out candidate/

      - name: Summarise the run
        id: summarise
        if: always()
        run: |
          if [[ ! -f run-report.json ]]; then
            echo "::error::the pipeline produced no report; it did not run to completion"
            exit 1
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          from pathlib import Path

          sys.path.insert(0, "packages/shared/src")
          from pmvl_shared.pipeline_dag import PIPELINE

          report = json.load(open("run-report.json"))
          statuses, skipped = report["statuses"], report["skipped"]

          missing = []
          for spec in PIPELINE:
              if spec.name in statuses:
                  print(f"::notice::{spec.name} {statuses[spec.name]}", file=sys.stderr)
              elif spec.name in skipped:
                  print(f"::warning::{spec.name} skipped - {skipped[spec.name]}", file=sys.stderr)
              else:
                  # A job silently vanishing from the run is the failure this catches.
                  missing.append(spec.name)
                  print(f"::error::{spec.name} did not run and was not skipped", file=sys.stderr)

          candidate_files = (
              Path("candidate/pmvl-snapshot.db"),
              Path("candidate/pmvl-snapshot.db.gz"),
              Path("candidate/pmvl-snapshot.manifest.json"),
              Path("run-report.json"),
          )
          missing_candidate_files = [str(path) for path in candidate_files if not path.is_file()]
          required_candidate_metadata = (
              "candidate_snapshot_id",
              "candidate_uncompressed_sha256",
              "candidate_compressed_sha256",
              "parent_snapshot_id",
              "parent_snapshot_sha256",
              "run_id",
          )
          missing_candidate_metadata = [
              field for field in required_candidate_metadata if not report.get(field)
          ]
          for field in (
              "candidate_uncompressed_sha256",
              "candidate_compressed_sha256",
              "parent_snapshot_sha256",
          ):
              value = str(report.get(field) or "")
              if value and (
                  len(value) != 64
                  or any(char not in "0123456789abcdef" for char in value.lower())
              ):
                  missing_candidate_metadata.append(f"{field} (invalid SHA-256)")
          candidate = not missing_candidate_files and not missing_candidate_metadata
          eligible = bool(report.get("publication_eligible")) and candidate and not missing

          print(f"candidate_exists={str(candidate).lower()}")
          print(f"publication_eligible={str(eligible).lower()}")
          print(f"parent_snapshot_id={report.get('parent_snapshot_id') or ''}")
          print(f"parent_snapshot_sha256={report.get('parent_snapshot_sha256') or ''}")
          print(f"candidate_snapshot_id={report.get('candidate_snapshot_id') or ''}")
          print(
              "candidate_uncompressed_sha256="
              f"{report.get('candidate_uncompressed_sha256') or ''}"
          )
          print(
              "candidate_compressed_sha256="
              f"{report.get('candidate_compressed_sha256') or ''}"
          )
          print(f"pipeline_run_id={report.get('run_id') or ''}")

          for blocker in report.get("publication_blockers", []):
              print(f"::warning::publication blocked: {blocker}", file=sys.stderr)
          if report.get("publication_eligible") and missing_candidate_files:
              for path in missing_candidate_files:
                  print(
                      f"::error::publication-eligible run did not produce {path}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)
          if report.get("publication_eligible") and missing_candidate_metadata:
              for field in missing_candidate_metadata:
                  print(
                      f"::error::publication-eligible run has no valid {field}",
                      file=sys.stderr,
                  )
              raise SystemExit(1)
          if missing:
              raise SystemExit(1)
          PY

      - name: Upload candidate and report
        # Only a validated candidate is uploaded. An artefact that failed
        # validation must not exist for a later job to find.
        if: steps.summarise.outputs.publication_eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pmvl-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            candidate/pmvl-snapshot.db
            candidate/pmvl-snapshot.db.gz
            candidate/pmvl-snapshot.manifest.json
            run-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload run report only
        # A failed or blocked run still leaves its report for diagnosis.
        if: always() && steps.summarise.outputs.publication_eligible != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pmvl-run-report-${{ github.run_id }}
          path: run-report.json
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish snapshot
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published_commit_sha: ${{ steps.commit.outputs.published_commit_sha }}
    # The only write token in this workflow, held by the only job that writes.
    permissions:
      contents: write
    # Every condition is required. A scheduled event fails the first test, a PR
    # event never reaches this workflow, and a preview branch fails the ref test.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == true &&
      vars.PMVL_SCHEDULE_PUBLISH_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      needs.research.result == 'success' &&
      needs.research.outputs.publication_eligible == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit the research job computed against. Checking out a
          # moved main would publish a candidate built from different code.
          ref: ${{ needs.research.outputs.source_commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e packages/shared -e packages/market-normalization -e services/api

      - name: Download the exact candidate
        uses: actions/download-artifact@v4
        with:
          # Named for this run. Never "the latest artifact": that would let a
          # concurrent or older run's candidate be published under this run's
          # authorisation.
          name: ${{ needs.research.outputs.artifact_name }}
          path: incoming

      - name: Revalidate the candidate independently
        env:
          EXPECTED_UNCOMPRESSED_SHA: ${{ needs.research.outputs.candidate_uncompressed_sha256 }}
          EXPECTED_COMPRESSED_SHA: ${{ needs.research.outputs.candidate_compressed_sha256 }}
          EXPECTED_CANDIDATE_ID: ${{ needs.research.outputs.candidate_snapshot_id }}
          EXPECTED_PARENT_ID: ${{ needs.research.outputs.parent_snapshot_id }}
          EXPECTED_PARENT_SHA: ${{ needs.research.outputs.parent_snapshot_sha256 }}
          EXPECTED_COMMIT: ${{ needs.research.outputs.source_commit_sha }}
          EXPECTED_PIPELINE_RUN_ID: ${{ needs.research.outputs.pipeline_run_id }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
          EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python scripts/verify_candidate.py \
            --candidate-raw incoming/candidate/pmvl-snapshot.db \
            --candidate-gzip incoming/candidate/pmvl-snapshot.db.gz \
            --manifest incoming/candidate/pmvl-snapshot.manifest.json \
            --report incoming/run-report.json \
            --published-manifest data/pmvl-snapshot.manifest.json

      - name: Rerun snapshot validation on the candidate
        run: |
          python scripts/validate_snapshot.py \
            --snapshot incoming/candidate/pmvl-snapshot.db \
            --compressed incoming/candidate/pmvl-snapshot.db.gz \
            --manifest incoming/candidate/pmvl-snapshot.manifest.json

      - name: Confirm main has not moved
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::main moved since the research job started; re-run the pipeline"
            exit 1
          fi

      - name: Commit the compressed snapshot and manifest together
        id: commit
        run: |
          git config user.name  "pmvl-pipeline[bot]"
          git config user.email "pmvl-pipeline@users.noreply.github.com"

          # release_status becomes 'published' only now, after the candidate has
          # been revalidated and immediately before the commit that makes it true.
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          src = Path("incoming/candidate")
          manifest = json.loads((src / "pmvl-snapshot.manifest.json").read_text())
          manifest["release_status"] = "published"
          Path("data/pmvl-snapshot.manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          shutil.copyfile(
              src / "pmvl-snapshot.db.gz",
              Path("data/pmvl-snapshot.db.gz"),
          )
          # Initial migration: the raw Git artefact is deleted in the same commit
          # that introduces its deterministic gzip representation. On later
          # publications this is already absent.
          Path("data/pmvl-snapshot.db").unlink(missing_ok=True)
          PY

          # The real publication boundary is the git commit, not os.replace in a
          # working directory. Stage only the three exact artefact paths, including
          # the legacy deletion, then inspect the ENTIRE index. A scoped count would
          # accept the wrong statuses and would not detect an unrelated staged file.
          git add -- \
            data/pmvl-snapshot.db.gz \
            data/pmvl-snapshot.manifest.json
          # `git add -A -- <raw> ...` fails once <raw> is no longer tracked,
          # which would break every gzip-to-gzip publication. Stage its deletion
          # only during the one legacy transition where it exists in HEAD.
          if git ls-files --error-unmatch -- data/pmvl-snapshot.db >/dev/null 2>&1; then
            git add -u -- data/pmvl-snapshot.db
          fi

          python - <<'PY'
          import json
          import subprocess

          RAW = "data/pmvl-snapshot.db"
          GZIP = "data/pmvl-snapshot.db.gz"
          MANIFEST = "data/pmvl-snapshot.manifest.json"

          def git_bytes(*args: str) -> bytes:
              result = subprocess.run(
                  ["git", *args],
                  check=True,
                  capture_output=True,
              )
              return result.stdout

          def tree_has(spec: str) -> bool:
              return subprocess.run(
                  ["git", "cat-file", "-e", spec],
                  capture_output=True,
              ).returncode == 0

          # The manifest is authoritative. File presence must agree with it; never
          # infer gzip merely because a .gz happens to be present.
          previous = json.loads(git_bytes("show", f"HEAD:{MANIFEST}"))
          previous_encoding = previous.get("artifact_encoding")
          if previous_encoding == "gzip":
              if tree_has(f"HEAD:{RAW}") or not tree_has(f"HEAD:{GZIP}"):
                  raise SystemExit(
                      "::error::HEAD declares gzip but its tracked artefact set disagrees"
                  )
              expected = frozenset({
                  ("M", GZIP),
                  ("M", MANIFEST),
              })
          elif previous_encoding in (None, "raw", "identity", "none"):
              if not tree_has(f"HEAD:{RAW}") or tree_has(f"HEAD:{GZIP}"):
                  raise SystemExit(
                      "::error::HEAD declares a legacy raw snapshot but its tracked "
                      "artefact set disagrees"
                  )
              expected = frozenset({
                  ("D", RAW),
                  ("A", GZIP),
                  ("M", MANIFEST),
              })
          else:
              raise SystemExit(
                  f"::error::unsupported previous artifact_encoding "
                  f"{previous_encoding!r}"
              )

          fields = git_bytes(
              "diff", "--cached", "--name-status", "--no-renames", "-z", "HEAD"
          ).decode().split("\0")
          if fields and fields[-1] == "":
              fields.pop()
          if len(fields) % 2:
              raise SystemExit("::error::could not parse the staged name/status set")
          actual = frozenset(zip(fields[0::2], fields[1::2], strict=True))
          if actual != expected:
              def render(changes):
                  return ", ".join(f"{status} {path}" for status, path in sorted(changes))
              raise SystemExit(
                  "::error::publication staged the wrong exact change set; "
                  f"expected [{render(expected)}], got [{render(actual)}]"
              )

          # Assert the resulting INDEX, not the working tree: this is exactly what
          # the commit will contain.
          if tree_has(f":{RAW}"):
              raise SystemExit(
                  "::error::raw and gzip snapshots would both remain after publication"
              )
          if not tree_has(f":{GZIP}") or not tree_has(f":{MANIFEST}"):
              raise SystemExit(
                  "::error::the staged gzip/manifest pair is incomplete"
              )
          staged_manifest = json.loads(git_bytes("show", f":{MANIFEST}"))
          if staged_manifest.get("artifact_encoding") != "gzip":
              raise SystemExit(
                  "::error::the staged manifest does not authoritatively declare gzip"
              )
          if staged_manifest.get("release_status") != "published":
              raise SystemExit(
                  "::error::the staged manifest is not marked published"
              )
          PY

          # No [skip ci]. GitHub suppresses push-triggered Actions when a
          # workflow's GITHUB_TOKEN creates the commit, so explicit read-only
          # reusable jobs below verify this exact SHA. The pipeline itself still
          # has no push trigger, which prevents recursive publication.
          git commit -m "data: publish validated snapshot from ${GITHUB_SHA:0:12}"
          echo "published_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the committed gzip contains the validated candidate
        # Working-tree validation is not enough: what the public serves is what
        # the commit contains.
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          names = (
              "data/pmvl-snapshot.db.gz",
              "data/pmvl-snapshot.manifest.json",
          )
          for name in names:
              blob = subprocess.run(
                  ["git", "show", f"HEAD:{name}"],
                  check=True,
                  capture_output=True,
              )
              Path("/tmp/committed-" + Path(name).name).write_bytes(blob.stdout)
          PY
          python scripts/verify_artifact.py \
            --compressed /tmp/committed-pmvl-snapshot.db.gz \
            --manifest /tmp/committed-pmvl-snapshot.manifest.json \
            --expected-uncompressed incoming/candidate/pmvl-snapshot.db \
            --expected-release published

      - name: Push
        run: |
          # Never --force, whatever the reason. But say which reason.
          #
          # This step previously reported EVERY rejection as "non-fast-forward,
          # main moved". The first real publication was rejected by GitHub push
          # protection instead, and the message sent the operator looking for a
          # race that had not happened - main had not moved at all.
          #
          # Push protection is a standing hazard here, not a one-off: the
          # published artefact is a 26MB binary SQLite file full of venue
          # identifiers, and secret scanning matches those by shape. The run that
          # exposed this tripped "Twilio Account String Identifier" on a market id
          # sitting between two sibling ids of the same 32-hex form (AB…, AC…,
          # AD…), which no Twilio credential ever does.
          if git push origin HEAD:main >push.log 2>&1; then
            cat push.log
          else
            cat push.log
            if grep -qiE "GH013|push protection|repository rule violations" push.log; then
              echo "::error::push BLOCKED by GitHub Push Protection. Nothing was published. Inspect the exact flagged bytes; do NOT allowlist the finding, bypass the rule, or disable secret scanning. This is not being classified as a non-fast-forward rejection."
            elif grep -qiE "non-fast-forward|fetch first|rejected.*behind" push.log; then
              echo "::error::push rejected as non-fast-forward: main moved during publication. Re-run the pipeline so research recomputes against the new parent. NOT force-pushing."
            else
              echo "::error::push failed for a reason this step does not recognise; see the log above. NOT force-pushing."
            fi
            exit 1
          fi

  verify-published-ci:
    name: Verify published commit
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      needs.publish.outputs.published_commit_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      commit_sha: ${{ needs.publish.outputs.published_commit_sha }}

  verify-published-production:
    name: Verify published production
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      needs.publish.outputs.published_commit_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/postdeploy-smoke.yml
    with:
      commit_sha: ${{ needs.publish.outputs.published_commit_sha }}

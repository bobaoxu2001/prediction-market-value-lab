[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmvl-shared"
version = "0.1.0"
description = "Shared config, money primitives, ORM models and schemas for Prediction Market Value Lab"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

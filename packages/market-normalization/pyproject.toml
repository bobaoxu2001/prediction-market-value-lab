[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmvl-markets"
version = "0.1.0"
description = "Providers, normalization, matching, pricing, probability, arbitrage and backtest engines"
requires-python = ">=3.11"
dependencies = [
    "pmvl-shared",
    "httpx>=0.28,<0.29",
    "tenacity>=9.0,<10",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<0.15",
]

[tool.setuptools.packages.find]
where = ["src"]
